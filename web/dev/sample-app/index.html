<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Test app</title>
    <!-- DEV FIXTURE — exercises the SDK from the dev harness. Not an app that ships with the tablet. -->
    <style>
        :root { --accent: var(--tablet-accent, #3b82f6); --bg: #0e1420; --card: #1b2334; --text: #e9eef7; --muted: #8b97ad; }
        [data-tablet-theme="light"] { --bg: #eef1f6; --card: #fff; --text: #111827; --muted: #5b6577; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, sans-serif; padding: 28px 36px; }
        h1 { margin: 0 0 4px; font-size: 26px; }
        p { margin: 0 0 20px; color: var(--muted); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: var(--card); border-radius: 14px; padding: 16px 18px; }
        .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
        button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; margin: 0 6px 6px 0; }
        input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(127,127,127,.3); background: transparent; color: inherit; font: inherit; }
        pre { margin: 0; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; max-height: 220px; overflow: auto; }
    </style>
</head>
<body>
    <h1>SDK test app</h1>
    <p id="meta">connecting…</p>
    <div class="grid">
        <div class="card">
            <h2>Actions</h2>
            <button id="req">request('ping')</button>
            <button id="notify">notify()</button>
            <button id="badge">setBadge(5)</button>
            <button id="clear">setBadge(0)</button>
            <button id="home">home()</button>
            <button id="close">close()</button>
        </div>
        <div class="card">
            <h2>Text input</h2>
            <input id="text" placeholder="Type here">
        </div>
        <div class="card" style="grid-column: 1 / -1">
            <h2>Event log</h2>
            <pre id="log"></pre>
        </div>
    </div>

    <script src="../../sdk/pdr-tablet.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const log = (...a) => { logEl.textContent = `${new Date().toLocaleTimeString()}  ${a.map((x) => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')}\n` + logEl.textContent; };

        PDRTablet.ready().then((tablet) => {
            document.getElementById('meta').textContent = `appId: ${tablet.appId} · launchData: ${JSON.stringify(tablet.launchData)}`;
            log('ready', tablet.settings);

            ['show', 'hide', 'launch', 'settings'].forEach((ev) => tablet.on(ev, (d) => log(ev, d ?? '')));
            tablet.on('message', (event, data) => log('message', event, data));

            document.getElementById('req').onclick = () => tablet.request('ping', { hello: 'world' })
                .then((r) => log('response', r)).catch((e) => log('error', e.message));
            document.getElementById('notify').onclick = () => tablet.notify('Test app', 'Hello from inside the app.');
            document.getElementById('badge').onclick = () => tablet.setBadge(5);
            document.getElementById('clear').onclick = () => tablet.setBadge(0);
            document.getElementById('home').onclick = () => tablet.home();
            document.getElementById('close').onclick = () => tablet.close();
        });
    </script>
</body>
</html>
