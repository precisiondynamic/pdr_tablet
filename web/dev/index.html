<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PDR OS · dev harness</title>
    <!--
        DEV ONLY — not part of the resource. Simulates the integration so the OS can be built
        and tested in a normal browser:  python3 -m http.server -d web 8080  →  http://localhost:8080/dev/
    -->
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr; background: #0b0d12; color: #d6dbe6; font: 13px/1.4 system-ui, sans-serif; }
        aside { padding: 16px; overflow: auto; border-right: 1px solid #1d2230; display: flex; flex-direction: column; gap: 14px; }
        h1 { font-size: 15px; margin: 0; }
        h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d879c; margin: 0 0 6px; }
        .row { display: flex; flex-wrap: wrap; gap: 6px; }
        button { background: #1d2433; color: #d6dbe6; border: 1px solid #2a3346; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
        button:hover { background: #26304a; }
        input { background: #121622; color: inherit; border: 1px solid #2a3346; border-radius: 6px; padding: 6px 8px; font: inherit; width: 100%; }
        main { display: flex; align-items: center; justify-content: center; padding: 24px; }
        .bezel { width: min(100%, calc((100vh - 48px) * 1.6)); aspect-ratio: 16 / 10; padding: 14px; border-radius: 28px; background: linear-gradient(145deg, #2a2d33, #0d0e11); box-shadow: 0 0 0 2px #3a3d44, 0 30px 80px rgba(0,0,0,.6); }
        iframe { width: 100%; height: 100%; border: 0; border-radius: 16px; background: #000; display: block; }
        #log { font: 11px/1.45 Consolas, monospace; background: #0f121a; border: 1px solid #1d2230; border-radius: 6px; padding: 8px; height: 220px; overflow: auto; white-space: pre-wrap; }
        #log .in { color: #7dd3fc; } #log .out { color: #fbbf24; }
    </style>
</head>
<body>
<aside>
    <h1>PDR OS · dev harness</h1>
    <section>
        <h2>Device</h2>
        <div class="row">
            <button data-send='{"action":"os:wake"}'>Wake</button>
            <button data-send='{"action":"os:sleep"}'>Sleep</button>
            <button data-send='{"action":"os:lock"}'>Lock</button>
            <button data-send='{"action":"apps:home"}'>Home</button>
        </div>
    </section>
    <section>
        <h2>Status (optional, provided by integration)</h2>
        <div class="row">
            <button data-send='{"action":"os:status","battery":76,"charging":false,"signal":3,"network":"Los Santos"}'>Set status</button>
            <button data-send='{"action":"os:status","battery":14,"charging":true}'>Low + charging</button>
            <button data-send='{"action":"os:status","battery":null,"signal":null,"network":null}'>Clear</button>
        </div>
    </section>
    <section>
        <h2>Bundled apps</h2>
        <div class="row">
            <button data-send='{"action":"apps:launch","id":"pdr.messages"}'>Messages</button>
            <button data-send='{"action":"apps:message","id":"pdr.messages","event":"incoming","data":{"from":"Dani Okafor","text":"pushed from the host 👋"}}'>Push SMS (host → app)</button>
            <button data-send='{"action":"apps:launch","id":"pdr.crypto"}'>LSX Crypto</button>
            <button data-send='{"action":"apps:launch","id":"pdr.crypto","data":{"coin":"CHOP"}}'>Deep link: CHOP</button>
            <button data-send='{"action":"apps:message","id":"pdr.crypto","event":"crypto:demoPayout","data":{"usd":450,"from":"Unknown sender","memo":"Package delivered"}}' title="Demo stand-in for the server's CryptoPay export. LSX must be running.">LSX: job payout $450</button>
            <button data-send='{"action":"apps:launch","id":"pdr.notes","data":{"create":true,"title":"From the host","body":"Created with launch data."}}'>Notes: create note</button>
            <button data-send='{"action":"apps:launch","id":"pdr.calculator"}'>Calculator</button>
            <button data-send='{"action":"apps:launch","id":"pdr.sdkdemo"}'>SDK Demo</button>
        </div>
        <div class="row" style="margin-top:6px">
            <button data-send='{"action":"os:init","bundledApps":false}'>bundledApps off</button>
            <button data-send='{"action":"os:init","bundledApps":true}'>bundledApps on</button>
            <button data-send='{"action":"os:init","devApps":false}'>devApps off</button>
        </div>
    </section>
    <section>
        <h2>External app (non-bundled path)</h2>
        <div class="row">
            <button id="reg">Register</button>
            <button id="reg-many">Register 6</button>
            <button id="unreg">apps:set []</button>
            <button id="launch">Launch</button>
            <button id="msg">Send message</button>
            <button id="badge">Badge 3</button>
        </div>
    </section>
    <section>
        <h2>Notification</h2>
        <input id="n-title" value="Delivery ready">
        <div class="row" style="margin-top:6px">
            <button id="notify">From Messages (deep link)</button>
            <button id="notify-os">From OS</button>
        </div>
    </section>
    <section>
        <h2>Protocol log</h2>
        <div id="log"></div>
    </section>
</aside>
<main>
    <div class="bezel"><iframe id="os" src="../os/index.html"></iframe></div>
</main>

<script>
    const os = document.getElementById('os');
    const logEl = document.getElementById('log');
    const appUrl = new URL('../apps/sdk-demo/index.html', location.href).href;
    const COLORS = ['#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777'];

    function log(dir, text) {
        const line = document.createElement('div');
        line.className = dir;
        line.textContent = `${dir === 'in' ? '→ OS ' : '← OS '} ${text}`;
        logEl.prepend(line);
    }

    function send(msg) {
        log('in', JSON.stringify(msg));
        os.contentWindow.postMessage(msg, '*');
    }

    // outbound events from the OS (in FiveM these are NUI callbacks)
    window.addEventListener('message', (e) => {
        const m = e.data;
        if (!m || !m.__pdrTabletEmit) return;
        const logged = JSON.stringify(m.data);
        log('out', `${m.event} ${logged.length > 400 ? logged.slice(0, 400) + '…' : logged}`);
        window.harnessReceived = window.harnessReceived || {};
        const key = m.event === 'app:request' ? 'request:' + m.data.action : m.event;
        window.harnessReceived[key] = (window.harnessReceived[key] || 0) + 1;
        // mirror app storage like an integration would (KVP), so restarts can be re-seeded
        if (m.event === 'app:storage') {
            const st = (window.harnessStorage = window.harnessStorage || {});
            if (m.data.cleared) st[m.data.id] = {};
            else {
                st[m.data.id] = st[m.data.id] || {};
                if (m.data.value === null) delete st[m.data.id][m.data.key]; else st[m.data.id][m.data.key] = m.data.value;
            }
        }
        let result = null;
        if (m.event === 'app:request') {
            // stand-in for the owning resource's onRequest handler; tests can install fakes per action
            const fake = window.harnessRequestHandlers && window.harnessRequestHandlers[m.data.action];
            result = fake
                ? fake(m.data)
                : { ok: true, data: { echo: m.data.data, action: m.data.action, at: new Date().toLocaleTimeString() } };
        }
        // a fake can return this to simulate an integration that never calls cb()
        if (result === '__NO_REPLY__') return;
        e.source.postMessage({ __pdrTabletReply: true, id: m.id, result }, '*');
    });

    document.querySelectorAll('[data-send]').forEach((b) => b.addEventListener('click', () => send(JSON.parse(b.dataset.send))));

    // the SDK demo page registered under another id, like a third-party resource would
    const testApp = (i = 0) => ({
        id: i ? `dev.test${i}` : 'dev.test',
        label: i ? `External ${i}` : 'External app',
        color: COLORS[i % COLORS.length],
        url: appUrl,
        order: 10 + i,
    });

    document.getElementById('reg').onclick = () => send({ action: 'apps:register', app: testApp() });
    document.getElementById('reg-many').onclick = () => { for (let i = 1; i <= 6; i++) send({ action: 'apps:register', app: testApp(i) }); };
    document.getElementById('unreg').onclick = () => send({ action: 'apps:set', apps: [] });
    document.getElementById('launch').onclick = () => send({ action: 'apps:launch', id: 'dev.test', data: { from: 'harness' } });
    document.getElementById('msg').onclick = () => send({ action: 'apps:message', id: 'dev.test', event: 'ping', data: { t: Date.now() } });
    document.getElementById('badge').onclick = () => send({ action: 'apps:badge', id: 'dev.test', count: 3 });
    document.getElementById('notify').onclick = () => send({ action: 'notify', appId: 'pdr.messages', data: { thread: 'marcus' }, title: document.getElementById('n-title').value, body: 'Sent from the dev harness.' });
    document.getElementById('notify-os').onclick = () => send({ action: 'notify', title: document.getElementById('n-title').value, body: 'System notification.' });

    os.addEventListener('load', () => {
        send({ action: 'os:init', deviceName: 'Dev harness' });
        send({ action: 'os:wake' });
    });
</script>
</body>
</html>
