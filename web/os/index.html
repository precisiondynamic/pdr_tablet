<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDR OS</title>
    <link rel="preload" href="fonts/cantarell-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/os.css">
    <!-- shared key-injection helpers (window.PDRTablet); the OS never calls ready() -->
    <script>window.__PDR_TABLET_OS__ = true;</script>
    <script src="../sdk/pdr-tablet.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div id="device" class="device is-asleep is-locked">
        <div id="wallpaper" class="wallpaper"></div>

        <main id="home" class="home"></main>
        <div id="apps" class="apps"></div>
        <div id="overview" class="overview"></div>
        <nav id="dash" class="dash"></nav>
        <div id="lock" class="lock"></div>

        <header id="topbar" class="topbar"></header>
        <div id="homebar" class="homebar" title="Home"></div>

        <div id="overlay-scrim" class="scrim"></div>
        <div id="calendar" class="popover popover-center tray"></div>
        <div id="quick" class="popover popover-end qs"></div>
        <div id="banners" class="banners"></div>
        <div id="menu-scrim" class="scrim menu-scrim"></div>
        <div id="menu" class="menu"></div>

        <div id="boot" class="boot is-hidden"></div>
        <div id="sleep" class="sleep"></div>
        <div id="dim" class="dim"></div>
    </div>
</body>
</html>
